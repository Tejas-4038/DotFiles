##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
	name = blueman-manager
	match:class = blueman-manager

	float = on
	stay_focused = on
	center = on
}

windowrule {
	name = pavucontrol
	match:class = org.pulseaudio.pavucontrol

	float = on
	stay_focused = on
	center = on
	size = (window_w*1.45) (window_h*1.3)
}

windowrule {
	name = vicinae
	match:class = vicinae
	
	float = on
	stay_focused = on
}

windowrule {
	name = thunar-rename-float
	match:class = thunar
	match:title = Rename(.*)|File Operation Progress
	
	float = on
	stay_focused = on
}

windowrule {
	name = transclusent
	match:class = thunar|vesktop|com.github.th_ch.youtube_music|io.github.elyprismlauncher.ElyPrismLauncher
	
	opacity = 0.9
}


layerrule {
	name = blur_layers
	match:namespace = waybar|swaync-control-center|swaync-notification-window|swayosd|rofi

	blur = on
	blur_popups = on
	ignore_alpha = 0.49
}
