##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
	name = float-center
	match:class = blueman-manager|vicinae|org.kde.kdeconnect.handler

	float = on
	center = on
}

windowrule {
	name = stay_focused
	match:class = gay.vaskel.soteria

	stay_focused = on
}

windowrule {
	name = pavucontrol
	match:class = org.pulseaudio.pavucontrol

	float = on
	center = on
	size = 750 500
}


windowrule {
	name = thunar-rename-float
	match:title = Rename(.*)|File Operation Progress|Extract
	
	float = on
	stay_focused = on
}

windowrule {
	name = gimp-export-float
	match:title = Export Image(.*)	
	float = on
}


windowrule {
	name = transclusent
	match:class = thunar|vesktop|com.github.th_ch.youtube_music|io.github.elyprismlauncher.ElyPrismLauncher|FFPWA-01K86J2FX5J1EEXYCQ272ECWE2|blueman-manager|org.pulseaudio.pavucontrol
	
	opacity = 0.9
}

windowrule {
	name = about-float
	match:class = kitty
	match:title = about

	float = on
	center = on
	size = 1600 900
}


layerrule {
	name = blur_layers
	match:namespace = waybar|swaync-control-center|swaync-notification-window|swayosd|rofi|vicinae

	blur = on
	blur_popups = on
	ignore_alpha = 0.49
}
